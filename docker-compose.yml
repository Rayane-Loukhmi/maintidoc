name: maintidoc

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: maintidoc-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - maintidoc

  postgres:
    image: postgres:16-alpine
    container_name: maintidoc-postgres
    environment:
      POSTGRES_DB: maintidoc
      POSTGRES_USER: maintidoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maintidoc_dev}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintidoc -d maintidoc"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - maintidoc

  adminer:
    image: adminer:latest
    container_name: maintidoc-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - maintidoc

  minio:
    image: bitnamilegacy/minio:latest
    container_name: maintidoc-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-maintidoc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-maintidoc_dev}
      MINIO_DEFAULT_BUCKETS: maintidoc
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - maintidoc

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maintidoc-app
    ports:
      - "8501:8501"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://maintidoc:${POSTGRES_PASSWORD:-maintidoc_dev}@postgres:5432/maintidoc
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "python -m maintidoc.bootstrap &&
             streamlit run app.py --server.address 0.0.0.0 --server.port 8501"
    networks:
      - maintidoc

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: maintidoc-mlflow
    profiles: ["mlops"]
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow
    networks:
      - maintidoc

volumes:
  qdrant_data:
  pg_data:
  minio_data:
  mlflow_data:

networks:
  maintidoc:
    driver: bridge
